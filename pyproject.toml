[project]
name = "erp_offline"
version = "0.1.0"
description = "Offline ERP/MRP system with PostgreSQL and installer support"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.27.0",
    "alembic>=1.14.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.19.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.10.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx2>=0.25.0",
    "ruff>=0.0.284",
    "gspread>=6.0.0",
    "google-auth>=2.0.0"
]

[project.scripts]
start = "app.main:main"

[tool.ruff]
line-length = 120
exclude = ["build", ".venv", "dist", "__pycache__", "temp_api_sequence.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "Q", "B", "S"]
ignore = ["I001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]
