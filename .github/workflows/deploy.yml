name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user -d erp_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Backend tests
        env:
          USE_SQLITE: '1'
          ERP_INITIAL_ADMIN_PASSWORD: admin
          ERP_DISABLE_INITIAL_PASSWORD_CHANGE: '1'
        run: python -m pytest tests -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd /opt/erp_local
            compose() {
              docker compose --env-file .env.production -f docker-compose.prod.yml "$@"
            }
            compose exec -T web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1833/ready', timeout=5)"
            git pull --ff-only origin main
            compose up -d db
            db_ready=0
            for attempt in $(seq 1 30); do
              if compose exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
                db_ready=1
                break
              fi
              sleep 2
            done
            test "$db_ready" -eq 1
            mkdir -p backups
            backup_file="backups/predeploy_$(date -u +%Y%m%d_%H%M%S).dump"
            compose exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump --format=custom --no-owner --no-privileges --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"' > "$backup_file"
            test -s "$backup_file"
            compose exec -T -i db pg_restore --list < "$backup_file" > /dev/null
            echo "Verified PostgreSQL backup: $backup_file"
            compose build web
            compose run --rm --no-deps web alembic upgrade head
            compose up -d web
            compose ps
            ready=0
            for attempt in $(seq 1 30); do
              if compose exec -T web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1833/ready', timeout=3)"; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1
